      <circle cx="-52" cy="102" r="13" fill="#FF9BA8" opacity=".45"/><circle cx="52" cy="102" r="13" fill="#FF9BA8" opacity=".45"/>

  add(`<svg class="abs" style="left:0;top:0" width="1920" height="1080">
    <path d="M840 0 L1280 0 L1520 812 L640 812 Z" fill="#6A52C4" opacity=".26"/>

       <rect x="856" y="722" width="26" height="90" fill="#4A3792"/><rect x="1358" y="722" width="26" height="90" fill="#4A3792"/></g>

      <circle cx="-2" cy="-96" r="13" fill="#8FA8D8"/></g>

    ${kid(760,392,1.18,'#FFFFFF','#26202E')}
    ${kid(1132,470,0.92,'#F0F3FA','#5A3A24')}

    <g transform="translate(944,700) rotate(16)">
      <path d="M-26 -132 L26 -132 L26 -50 L64 40 L-64 40 Z" fill="#EAF2FF"/>

// ══════════ 4. 다큐멘터리 ══════════
if (V === 4) {
  add(`<div class="abs" style="inset:0;background:radial-gradient(ellipse 78% 66% at 48% 46%,#0A1E26 0%,#02070B 76%)"></div>`);
  let seed = 21;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const cell = (soft) => {
    let g = '';
    for (let i = 0; i < (soft ? 16 : 26); i++) {
      const x = -40 + rnd() * 2000, y = -40 + rnd() * 1160;
      const rod = rnd() > .45;
      const L = (rod ? 46 : 20) + rnd() * (rod ? 90 : 34);
      const W = 18 + rnd() * 22;
      const rot = rnd() * 180;
      const c = rnd() > .4 ? '78,240,206' : '84,176,255';
      const a = soft ? .30 + rnd() * .22 : .55 + rnd() * .4;
      const dots = Array.from({length: rod ? 3 : 1}).map((_, k) => {
        const px = rod ? (-L / 2 + 14 + k * (L - 28) / 2) : 0;
        return `<circle cx="${px.toFixed(0)}" cy="0" r="${(W * .26).toFixed(1)}" fill="rgba(${c},${a.toFixed(2)})"/>`;
      }).join('');
      g += `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${rot.toFixed(0)})">
