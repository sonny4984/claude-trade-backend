// ───────────────────────── 4. 다큐멘터리 ─────────────────────────

  // 발광 입자. 포도당 알갱이를 어둠 속에 흩뿌린 느낌.
  let dots = '';
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let i = 0; i < 46; i++) {
    const x = 60 + rnd() * 1800, y = 60 + rnd() * 960, r = 12 + rnd() * 44;
    const c = rnd() > .45 ? '86,240,208' : '96,190,255';
    dots += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}"
              fill="rgba(${c},${(0.10 + rnd() * 0.22).toFixed(2)})"/>
             <circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(r * .34).toFixed(0)}"
              fill="rgba(${c},${(0.45 + rnd() * 0.4).toFixed(2)})"/>`;
  }
  add(`<svg class="abs" style="left:0;top:0" width="1920" height="1080">${dots}</svg>`);

        <line x1="0" y1="103" x2="164" y2="103"/></g></g>`;
  }
  add(`<svg class="abs" style="left:0;top:0" width="1920" height="1080">${tiles}</svg>`);
