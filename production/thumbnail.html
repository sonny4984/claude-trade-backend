<meta charset="utf-8">
<title>썸네일</title>
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard-SemiBold.otf');font-weight:600}
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard-Bold.otf');font-weight:700}
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard-ExtraBold.otf');font-weight:800}
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard-Black.otf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#080D1C}
body{font-family:'Pretendard';-webkit-font-smoothing:antialiased;position:relative}
#hero{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover}

/* 좌상단 가독성 스크림 — 초콜릿/콜라는 살리고 카피 영역만 눌러준다 */
#scrimA{position:absolute;inset:0;
  background:linear-gradient(112deg,rgba(4,8,20,.95) 0%,rgba(4,8,20,.88) 26%,
             rgba(4,8,20,.55) 42%,rgba(4,8,20,.10) 56%,rgba(4,8,20,0) 66%)}
#scrimB{position:absolute;left:0;top:0;width:1180px;height:640px;
  background:radial-gradient(ellipse 78% 82% at 26% 40%,rgba(3,6,16,.86),rgba(3,6,16,0) 72%)}
#topfade{position:absolute;left:0;right:0;top:0;height:210px;
  background:linear-gradient(180deg,rgba(3,6,16,.80),rgba(3,6,16,0))}
#botfade{position:absolute;left:0;right:0;bottom:0;height:190px;
  background:linear-gradient(0deg,rgba(3,6,16,.72),rgba(3,6,16,0))}

#wrap{position:absolute;left:92px;top:104px;width:920px}

.kick{display:inline-flex;align-items:center;gap:15px;font-size:31px;font-weight:800;
  letter-spacing:.28em;color:#7DE0FF;text-shadow:0 3px 16px rgba(0,0,0,.95)}
.kick i{display:block;width:50px;height:5px;border-radius:3px;
  background:linear-gradient(90deg,#35D0FF,#A77BFF);font-style:normal}

.l1{margin-top:26px;font-size:70px;font-weight:800;color:#DCE7FF;letter-spacing:-.035em;
  -webkit-text-stroke:7px #05091A;paint-order:stroke fill;
  text-shadow:0 5px 24px rgba(0,0,0,.95)}
.l2{margin-top:6px;font-size:132px;font-weight:900;letter-spacing:-.055em;line-height:1.04;
  color:#FFFFFF;white-space:nowrap;
  -webkit-text-stroke:13px #05091A;paint-order:stroke fill;
  text-shadow:0 12px 40px rgba(0,0,0,.9)}
.l2 b{color:#FFD54A;font-weight:900}

#tags{margin-top:40px;display:flex;align-items:center;gap:16px}
.tag{font-size:35px;font-weight:900;letter-spacing:-.015em;padding:15px 32px;border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.7)}
.t-red{background:#FF2D55;color:#fff}
.t-out{background:rgba(6,11,26,.80);border:4px solid #35D0FF;color:#CFF1FF}

#brand{position:absolute;left:96px;bottom:58px;display:flex;align-items:center;gap:14px;
  font-size:27px;font-weight:800;letter-spacing:.20em;color:#94A9CE;
  text-shadow:0 3px 14px rgba(0,0,0,1)}
#brand em{display:block;width:11px;height:11px;border-radius:50%;background:#2FE0A0;font-style:normal}
</style>

<img id="hero" src="hero.png">
<div id="scrimA"></div><div id="scrimB"></div><div id="topfade"></div><div id="botfade"></div>

<div id="wrap">
  <div><span class="kick"><i></i>3분 과학 소통</span></div>
  <div class="l1">당 충전 했는데,</div>
  <div class="l2">왜 <b>더 졸릴까?</b></div>
  <div id="tags">
    <span class="tag t-red">혈당 스파이크</span>
    <span class="tag t-out">뇌 과학의 비밀</span>
  </div>
</div>

<div id="brand"><em></em>혈당 × 집중력</div>
